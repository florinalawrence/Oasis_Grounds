<header class="property-header">
  <div class="container-fluid">
    <div class="breadcrumb ms-2 mt-2">
      <a [routerLink]="['/home']">Home</a>&nbsp;/&nbsp;<a [routerLink]="['/all-property']"
        >All Properties</a
      >
      &nbsp;/&nbsp;View Property
    </div>
    <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
      <!-- Left Section: Back Button + Property Info -->
      <div class="d-flex align-items-center gap-3 flex-fill min-width-0">
        <button class="btn back-btn flex-shrink-0">
          <i class="bi bi-arrow-left"></i>
        </button>
        <div class="min-width-0 flex-fill">
          <h1 class="h5 mb-1 text-truncate">Modern Family Home in Beverly Hills</h1>
          <div class="d-flex align-items-center gap-2 text-muted small">
            <i class="bi bi-geo-alt flex-shrink-0"></i>
            <span class="text-truncate">123 Main Street, Beverly Hills, CA 90210</span>
          </div>
        </div>
      </div>

      <!-- Right Section: Price Info -->
      <div class="text-end flex-shrink-0">
        <p class="mb-1 text-muted small">For Sale</p>
        <h2 class="h4 mb-0 fw-bold">₹3,00,000</h2>
      </div>
    </div>
  </div>
</header>
