<!-- property-page.html -->
<div class="main-container bg-white pb-3">
  @if (propertyData()) {
    <app-property-header [propertyData]="propertyData()" [navigationSource]="navigationSource()"></app-property-header>

    <div class="container-fluid my-4">
      <!-- Layout for my-properties source: Full width with view-property only -->
      @if (navigationSource() === 'my-properties') {
        <div class="row">
          <div class="col-12">
            <app-view-property [propertyData]="propertyData()"></app-view-property>
          </div>
        </div>
      } @else {
        <!-- Default layout: property-details with contact-agent sidebar -->
        <div class="row g-4">
          <!-- Main Content -->
          <div class="col-lg-8">
            <app-property-gallery></app-property-gallery>
            <div class="mt-4">
              <app-property-details></app-property-details>
            </div>
          </div>

          <!-- Sidebar -->
          <div class="col-lg-4">
            <app-contact-agent></app-contact-agent>
          </div>
        </div>
      }
    </div>
  } @else if (isLoading()) {
    <div class="d-flex justify-content-center align-items-center" style="min-height: 400px;">
      <div class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading property details...</p>
      </div>
    </div>
  } @else {
    <div class="d-flex justify-content-center align-items-center" style="min-height: 400px;">
      <div class="text-center">
        <h4 class="text-muted">Property not found</h4>
        <p class="text-muted">The requested property could not be loaded.</p>
        <button class="btn btn-primary" (click)="goToHome()">
          Go to Home
        </button>
      </div>
    </div>
  }
</div>

<!-- Spinner -->
<ngx-spinner 
  bdColor="rgba(0, 0, 0, 0.2)" 
  size="medium" 
  color="#fff" 
  type="ball-clip-rotate" 
  [fullScreen]="true">
</ngx-spinner>
