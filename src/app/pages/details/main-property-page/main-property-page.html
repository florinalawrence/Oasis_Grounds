<!-- property-page.html -->
<div class="main-container bg-white pb-3">
  @if (propertyData()) {
    <app-property-header [propertyData]="propertyData()" [navigationSource]="navigationSource()"></app-property-header>

    <div class="container-fluid my-4">
      <!-- Layout for my-properties source: view-property only -->
      @if (navigationSource() === 'my-properties') {
        <div class="row gx-0">
          <div class="col-12 px-0">
            <app-view-property [propertyData]="propertyData()" [navigationSource]="navigationSource()"></app-view-property>
          </div>  
        </div>
      } @else {
        <!-- Default layout for all-properties: property-gallery + property-details + contact-agent -->
        <!-- DEBUG: Navigation source is {{ navigationSource() }} -->
        <div class="row g-4">
          <!-- Main Content -->
          <div class="col-lg-8">
            <app-property-gallery [propertyData]="propertyData()"></app-property-gallery>
            <div class="mt-4">
              <app-property-details [propertyData]="propertyData()"></app-property-details>
            </div>
          </div>
          
          <!-- Sidebar -->
          <div class="col-lg-4">
            <app-contact-agent></app-contact-agent> 
          </div>
        </div>
      }
    </div>
  } @else if (isLoading()) {
    <!-- <div class="d-flex justify-content-center align-items-center" style="min-height: 400px;">
      <div class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading property details...</p>
      </div>
    </div> -->
  } @else {
    <div class="d-flex justify-content-center align-items-center" style="min-height: 400px;">
      <div class="text-center">
        <h4 class="text-muted">Property not found</h4>
        <p class="text-muted">The requested property could not be loaded.</p>
        <button class="btn btn-primary" (click)="goToHome()">
          Go to Home
        </button>
      </div>
    </div>
  }
</div>

<!-- Common Spinner -->
<app-common-spinner></app-common-spinner>
