<!-- property-page.html -->
<div class="main-container bg-white pb-3">
  @if (propertyData()) {
    <app-property-header [propertyData]="propertyData()" [navigationSource]="navigationSource()"></app-property-header>

    <div class="container-fluid my-4">
      <div class="row g-4">
        <!-- Main Content - Adjust column size based on whether contact section is shown -->
        <div [class]="shouldShowContactSection() ? 'col-lg-8' : 'col-lg-12'">
          <app-property-gallery [propertyData]="propertyData()" [navigationSource]="navigationSource()"></app-property-gallery>
          <div class="mt-4">
            <app-property-details [propertyData]="propertyData()"></app-property-details>
          </div>
        </div>

        <!-- Sidebar - Only show for public property views (from all-properties) -->
        @if (shouldShowContactSection()) {
          <div class="col-lg-4">
            <app-contact-agent [propertyData]="propertyData()"></app-contact-agent>
          </div>
        }
      </div>
    </div>
  } @else if (isLoading()) {
    <div class="d-flex justify-content-center align-items-center" style="min-height: 400px;">
      <!-- <div class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading property details...</p>
      </div> -->
    </div>
  } @else {
    <div class="d-flex justify-content-center align-items-center" style="min-height: 400px;">
      <div class="text-center">
        <h4 class="text-muted">Property not found</h4>
        <p class="text-muted">The requested property could not be loaded.</p>
        <button class="btn btn-primary" (click)="goToHome()">
          Go to Home
        </button>
      </div>
    </div>
  }
</div>
