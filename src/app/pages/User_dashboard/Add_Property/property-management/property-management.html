<div class="card shadow-sm mt-4" style="max-width: 1200px;">
    
      <h3 class="card-title p-3 mb-0 border-bottom">
        About Property
      </h3>
   
    <div class="card-body p-3">
      <!-- Property Features -->
      <div class="feature-section mb-4">
        <label class="section-label">
          Property Features
        </label>
        <input
          type="text"
          class="form-control"
          placeholder="Type to search or add custom features..."
        />
      
      </div>

      <!-- Property Facilities -->
      <div class="feature-section mb-4">
        <label class="section-label">
          Manage Facility For Property
        </label>
        <input
          type="text"
          class="form-control"
          placeholder="Type to search or add custom facilities..."
        />
        
      </div>

      <!-- Action Buttons -->
       <div class="justify-content-end gap-3 pt-4 module-property d-flex align-items-center">
          <button type="button" class="btn btn-outline-secondary">Clear All</button>
          <button type="submit" class="btn btn-primary shadow-sm">Save</button>
              
        </div>
    </div>
  </div>
