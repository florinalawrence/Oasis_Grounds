<div class="card shadow-sm mt-4" style="max-width: 1200px">
  <h3 class="card-title mb-0 p-3 border-bottom">Attachments</h3>

  <div class="card-body p-3">
    <div class="mb-4">
      <label for="fileInput" class="section-label">Documents / Brochure Attachments</label>
      <div class="mt-2">
        <input 
          id="fileInput" 
          type="file" 
          class="form-control" 
          (change)="onSelectBrouchure($event)" 
          multiple
          accept=".jpg,.jpeg,.gif,.pdf,.png"
          style="max-width: 400px;">
        <small class="text-muted d-block mt-1">
          Accepted formats: PDF, JPG, JPEG, PNG, GIF (Max size: 2MB per file)
        </small>
      </div>
    </div>

    <!-- Document Gallery -->
    <div class="document-gallery mt-4" *ngIf="otherAttachmentList.length > 0">
      <div class="row g-3">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let item of otherAttachmentList; let i=index">
          <div class="document-card card h-100 position-relative" 
               matTooltipPosition="above"  
               [matTooltip]="'File Name: ' + item?.documentName">
            
            <!-- Delete Button -->
            <button 
              class="btn-delete position-absolute top-0 end-0 m-2 btn btn-sm btn-danger rounded-circle"
              (click)="deleteDocumentUpload(item)"
              type="button"
              aria-label="Delete document">
              <i class="bi bi-x-lg"></i>
            </button>

            <!-- Document Preview -->
            <a [href]="item?.documentUrl" target="_blank" class="text-decoration-none">
              <div class="card-body text-center p-3">
                <!-- PDF Icon -->
                <div class="document-preview mb-2" *ngIf="item?.documentType === 'pdf'">
                  <img 
                    class="img-fluid" 
                    src="assets/images/pdf_svg.svg" 
                    alt="PDF Document"
                    style="max-height: 120px; width: auto;">
                </div>
                
                <!-- Image Preview -->
                <div class="document-preview mb-2" *ngIf="item?.documentType !== 'pdf'">
                  <img 
                    class="img-fluid rounded" 
                    [src]="item?.documentUrl" 
                    alt="Document preview"
                    style="max-height: 120px; width: 100%; object-fit: cover;">
                </div>

                <!-- Document Name -->
                <p class="document-name small text-truncate mb-0" [title]="item?.documentName">
                  {{ item?.documentName }}
                </p>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="text-center py-4 text-muted" *ngIf="otherAttachmentList.length === 0">
      <i class="bi bi-file-earmark-text" style="font-size: 3rem; opacity: 0.3;"></i>
      <p class="mb-0 mt-2">No documents uploaded yet</p>
    </div>
  </div>
</div>
