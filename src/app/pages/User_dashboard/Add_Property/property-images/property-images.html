<form action="">
  <div class="row mb-2">
    <!-- Featured Image Section -->
    <div class="col-xs-12 col-sm-12 col-md-12">
      <h5 class="form--title">Featured Image</h5>
      <div class="upload--img-area">
        <div class="imgSection rounded-circle">
          <img id="img1" [src]="featureImgUrl ? featureImgUrl : '/assets/images/no_image.png'" alt="Featured Image">
          <a class="delete-img" (click)="deleteFeatureImage(featureImgUrl)"
            *ngIf="featureImgUrl"><i class="bi bi-x-circle-fill"></i></a>
        </div>
        <div class="uploadBtnSection">
          <label for="fileInput" class="btn btn--primary">
            <input id="fileInput" type="file" (change)="onSelectFeaturedImage($event)" />Upload</label>
        </div>
      </div>
    </div>

    <!-- List of Images Section -->
    <div class="col-xs-12 col-sm-12 col-md-12">
      <h5 class="form--title">List of Images</h5>
      <div class="uploadBtnSection">
        <label for="fileInputList" class="">
          <input id="fileInputList" type="file" (change)="onSelectListOfImages($event)" multiple accept=".jpg, .png" />
        </label>
      </div>
    </div>

    <!-- Display Gallery -->
    <div class="col-xs-12 col-sm-4 col-md-12" *ngIf="listOfImagePath?.length > 0">
      <div id="dZUpload" class="dropzone">
        <div class="gallery-home">
          <div *ngFor="let fileURL of listOfImagePath; let i = index">
            <div class="card galleryCard">
              <div class="listOfImgSection">
                <img class="listOfImg" [src]="fileURL ? fileURL : 'assets/images/no-image.png'" alt="Selected Image">
                <a class="delete-img-from-lists" (click)="deleteListOfImage(fileURL)">
                  <i class="bi bi-x-circle-fill"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
