>

<!-- Step 2: Property Management -->

>
</app-property-management>

<!-- Step 3: Nearby Locations -->

  (propertyDataUpdate)="onPropertyDataUpdate($event)"
>
</app-nearby-locations>
<!-- </div> -->

<!-- Step 4: Property Images -->
<!-- <div class="property-section">

<app-property-images
  [selectedPropertyData]="selectedPropertyData"
  (propertyDataUpdate)="onPropertyDataUpdate($event)"
>
</app-property-images>
<!-- </div> -->

<!-- Step 5: Document Attachments -->

<app-document-attachment
  [selectedPropertyData]="selectedPropertyData"

>
</app-document-attachment>
<!-- </div> -->

<!-- Step 6: Property Location -->
<!-- <div class="property-section">
      <h4 class="section-title">Property Location</h4> -->

  [selectedPropertyData]="selectedPropertyData"

>
</app-property-location>
<!-- </div> -->
} @else {
<!-- Loading or Error State -->
<div class="loading-state">
  <!-- <div class="alert alert-info">
        <h5>Loading Property Data...</h5>
        <p>Please wait while we load the property information.</p> -->
  @if (!propertyId) {
  <p class="text-warning">
    ⚠️ No property ID found in URL. Please ensure you have a valid property ID.
  </p>
  }
</div>
<!-- </div> -->
}

<app-common-spinner></app-common-spinner>
